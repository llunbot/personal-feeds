name: Feeds

on:
  push:
    branches:
      - main
  workflow_dispatch:
  issues:
    types: [opened]

jobs:
  feeds:
    runs-on: ubuntu-latest
    name: Build static feeds site
    permissions:
      contents: write
      issues: write
    steps:
      - name: Run Action
        uses: llun/feeds@4.9.3
        with:
          storageType: files
          # feeds.llun.dev is served by CloudFront with this repository's GitHub
          # Pages site as its origin, so Pages has no custom domain (no CNAME).
          # siteUrl keeps the site at the root path and its feed links on
          # feeds.llun.dev.
          siteUrl: https://feeds.llun.dev/
